# Glows. Each one needs the permission halo.glow.<id> (halo.glow.* gives all of them), or your own
# with `permission:`. Players pick one with /glow equip <id>.
#
# The outline of a glowing player can only have one of the 16 Minecraft colours:
#   black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray,
#   dark_gray, blue, green, aqua, red, light_purple, yellow, white
# A colour can also be written as its code, like c or &c.
#
# type      SINGLE  one colour, always
#           CYCLE   the colours one after the other, over and over
#           BOUNCE  the colours forwards and then backwards
#           FLASH   each colour blinks on and off
#           Without a type, one colour is SINGLE and more than one is CYCLE.
# color     the colour of a SINGLE glow
# colors    the colours of the other types
# interval  ticks between two changes (20 = one second)
# display   the name in /glow list and menus (default: the id)
# permission  replaces halo.glow.<id>

glows:
  # ---- one colour ----
  red:
    color: red
  gold:
    color: gold
  yellow:
    color: yellow
  green:
    color: green
  aqua:
    color: aqua
  blue:
    color: blue
  purple:
    color: light_purple
  white:
    color: white

  # ---- several colours, one after the other ----
  rainbow:
    display: "Rainbow"
    type: CYCLE
    interval: 10
    colors: [red, gold, yellow, green, aqua, blue, dark_purple, light_purple]
  tropical:
    display: "Tropical"
    type: CYCLE
    interval: 20
    colors: [gold, yellow, aqua, green]
  candy:
    display: "Candy"
    type: CYCLE
    interval: 15
    colors: [light_purple, white]

  # ---- forwards and backwards ----
  ocean:
    display: "Ocean"
    type: BOUNCE
    interval: 8
    colors: [dark_blue, blue, aqua, white]
  fire:
    display: "Fire"
    type: BOUNCE
    interval: 5
    colors: [dark_red, red, gold, yellow]

  # ---- flashing ----
  police:
    display: "Police"
    type: FLASH
    interval: 4
    colors: [red, blue]
  strobe:
    display: "Strobe"
    type: FLASH
    interval: 3
    colors: [white]
  glitch:
    display: "Glitch"
    type: FLASH
    interval: 2
    colors: [aqua, light_purple, white]

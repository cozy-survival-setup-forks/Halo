# Halo
#
# The glows themselves are in glows.yml, the texts in messages.yml. Reload both with /glow reload.
#
# Every glow has the permission halo.glow.<id>, and halo.glow.* gives all of them. A glow can have its own
# permission with `permission:` in glows.yml.

# false lets everybody use every glow.
use-permissions: true

# When TAB is installed, Halo gives the glow colour to TAB, so TAB's name tag teams keep working and the
# rank prefix stays. Nothing has to be added to TAB's files. The name above the head takes the glow colour too.
# Set this to false to leave TAB alone and use Halo's own teams.
tab-integration: true

# Worlds where nobody glows. A player's glow comes back when they leave the world.
disabled-worlds: []
